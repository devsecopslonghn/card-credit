services:
  card-credit:
    image: ${DOCKER_IMAGE:-card-credit}:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
    ports:
      - "${APP_PORT:-8080}:3000"
    restart: unless-stopped
