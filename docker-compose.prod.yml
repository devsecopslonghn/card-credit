services:
  card-credit:
    container_name: card-credit
    image: ${DOCKER_IMAGE:-card-credit}:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:3000"
    restart: unless-stopped
